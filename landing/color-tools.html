<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>컬러 도구 - ModifyKit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors">
  <div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-6">컬러 도구</h1>
    <div class="grid md:grid-cols-2 gap-6">
      <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow">
        <h2 class="text-xl font-semibold mb-4">컬러 피커</h2>
        <input type="color" id="colorPicker" class="w-20 h-10 p-0 border rounded cursor-pointer">
        <div class="mt-3 flex gap-2">
          <input type="text" id="hexValue" class="flex-1 px-3 py-2 border rounded text-center" readonly>
          <button onclick="copyHex()" class="px-4 py-2 bg-blue-600 text-white rounded">복사</button>
        </div>
      </div>
      <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow">
        <h2 class="text-xl font-semibold mb-4">컬러 변환</h2>
        <div class="space-y-3">
          <div>
            <label class="block mb-1">HEX</label>
            <input type="text" id="hexInput" class="w-full px-3 py-2 border rounded" placeholder="#RRGGBB">
          </div>
          <div class="flex justify-between text-sm">
            <div><span class="font-medium">RGB:</span> <span id="rgbOutput">rgb(0, 0, 0)</span></div>
            <div><span class="font-medium">HSL:</span> <span id="hslOutput">hsl(0, 0%, 0%)</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const colorPicker = document.getElementById('colorPicker');
    const hexValue = document.getElementById('hexValue');
    const hexInput = document.getElementById('hexInput');
    const rgbOutput = document.getElementById('rgbOutput');
    const hslOutput = document.getElementById('hslOutput');

    colorPicker.addEventListener('input', (e) => {
      hexValue.value = e.target.value;
    });

    hexInput.addEventListener('input', (e) => {
      let hex = e.target.value.replace('#', '');
      if (hex.length === 6) {
        const r = parseInt(hex.substr(0, 2), 16);
        const g = parseInt(hex.substr(2, 2), 16);
        const b = parseInt(hex.substr(4, 2), 16);
        rgbOutput.textContent = `rgb(${r}, ${g}, ${b})`;
        const h = rgbToHsl(r, g, b);
        hslOutput.textContent = `hsl(${Math.round(h[0])}, ${Math.round(h[1])}%, ${Math.round(h[2])}%)`;
      }
    });

    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, l = (max + min) / 2;
      if (max === min) { h = s = 0; } else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        } h /= 6;
      }
      return [h * 360, s * 100, l * 100];
    }

    function copyHex() {
      hexValue.select();
      document.execCommand('copy');
    }
  </script>
</body>
</html>
