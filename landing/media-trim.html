<head>

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://modifykit.com">
  
  <!-- Preconnect to main site -->
  <link rel="preconnect" href="https://modifykit.com">
  
  <!-- Canonical URL pointing to main page -->
  <link rel="canonical" href="https://modifykit.com/media-advanced/">
  
  <!-- Structured Data (JSON-LD) for SEO -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Video/Audio Trimmer",
    "description": "원하지 않는 부분을 잘라내는 데 정밀한 커팅과 미리보기 기능으로 비디오와 오디오 파일을 트림하세요.",
    "applicationCategory": "UtilityApplication",

  }
  </script>
  
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9fafb;
      color: #111827;
    }
    .container {
      max-width: 640px;
      margin: 40px auto;
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    p {
      color: #6b7280;
      margin-bottom: 2rem;
    }
    .loading {
      display: inline-block;
      width: 2rem;
      height: 2rem;
      border: 3px solid #e5e7eb;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .redirect-link {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 500;
    }
    .redirect-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="loading" role="status"></div>
    <h1>Video/Audio Trimmer</h1>
    <p>이 도구를 사용하는 중입니다. 자동으로 이동 중입니다...</p>
    <p>
      이동하지 않는 경우 
      <a href="https://modifykit.com/#tool-media-advanced" class="redirect-link">여기를 클릭하세요</a>
    </p>
  </div>
  
  <script>
    // Redirect to SPA with tool anchor
    var toolKey = 'media-advanced';
    
    // Determine redirect target based on environment
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      // Local development: redirect to SPA with hash
      window.location.href = '/#tool-' + toolKey;
    } else {
      // Production: redirect to main site
      window.location.href = 'https://modifykit.com/#tool-' + toolKey;
    }
  </script>
</body>
</html>
