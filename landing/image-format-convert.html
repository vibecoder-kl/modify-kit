  <style>

    }

      margin-bottom: 2rem;
    }

      width: 2rem;
      height: 2rem;
      border: 3px solid #e5e7eb;
      border-top-color: #3b82f6;
      border-radius: 50%;

    .redirect-link {

  <script>
    // Redirect to SPA with tool anchor
    var toolKey = 'image-tools';
    
    // Determine redirect target based on environment
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
